name: CI - Tests Python

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false

      - name: Preparer Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: python -m pip install -r requirements.txt

      - name: Executer les tests
        run: python -m pytest -q

      - name: Construire l'image Docker
        run: docker build -t inventaire:ci .

      - name: Verifier le conteneur
        run: |
          docker run -d --name inventaire-ci -p 127.0.0.1:8080:8000 inventaire:ci
          trap 'docker rm -f inventaire-ci >/dev/null' EXIT

          for tentative in {1..10}; do
            statut=$(curl -s --max-time 2 -o /dev/null -w '%{http_code}' \
              http://127.0.0.1:8080/health) || statut=000
            if [ "$statut" = "200" ]; then
              echo "Le conteneur repond avec HTTP 200"
              exit 0
            fi
            sleep 2
          done

          docker logs inventaire-ci
          exit 1

      - name: Exporter l'image testee
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save -o "$RUNNER_TEMP/inventaire.tar" inventaire:ci

      - name: Transmettre l'image testee
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: image-inventaire
          path: ${{ runner.temp }}/inventaire.tar
          retention-days: 1


  publier:
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
      - name: Recuperer l'image testee
        uses: actions/download-artifact@v4
        with:
          name: image-inventaire
          path: ${{ runner.temp }}

      - name: Publier sur GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker load -i "$RUNNER_TEMP/inventaire.tar"
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin
          docker tag inventaire:ci "$image"
          docker push "$image" | tee "$RUNNER_TEMP/ghcr-push.log"
          digest=$(awk '$2 == "digest:" {print $3}' "$RUNNER_TEMP/ghcr-push.log")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'Image publiée : `%s@%s`\n' "${image%:*}" "$digest" >> "$GITHUB_STEP_SUMMARY"
